<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SBE Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      font-family: "Segoe UI", sans-serif;
    }
  </style>
</head>

<body class="bg-black text-white p-4 sm:p-8">

  <!-- HEADER WITH LOGOUT -->
  <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-10 pb-6 border-b border-zinc-700">
    <div>
      <h1 class="text-3xl sm:text-5xl font-black text-yellow-500">
        <i class="fa-solid fa-scissors mr-3"></i>SBE ADMIN DASHBOARD
      </h1>
      <p class="text-zinc-400 text-sm mt-2">
        <i class="fa-solid fa-user mr-2"></i><span id="adminEmailDisplay">Admin</span>
      </p>
    </div>
    
    <div class="flex gap-3">
      <a href="/" class="bg-zinc-800 hover:bg-zinc-700 text-white font-bold px-4 sm:px-6 py-2 sm:py-3 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-home"></i>
        <span class="hidden sm:inline">Home</span>
      </a>
      <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-700 text-white font-bold px-4 sm:px-6 py-2 sm:py-3 rounded-lg transition flex items-center gap-2">
        <i class="fa-solid fa-sign-out-alt"></i>
        <span class="hidden sm:inline">Logout</span>
      </button>
    </div>
  </header>

  <!-- TAB NAVIGATION -->
  <div class="mb-8 flex gap-4 border-b border-zinc-700 overflow-x-auto">
    <button 
      onclick="switchTab('bookings')"
      id="tab-bookings"
      class="px-4 sm:px-6 py-3 font-bold border-b-4 border-yellow-500 text-yellow-500 transition whitespace-nowrap"
    >
      <i class="fa-solid fa-list mr-2"></i>Bookings
    </button>
    <button 
      onclick="switchTab('payments')"
      id="tab-payments"
      class="px-4 sm:px-6 py-3 font-bold border-b-4 border-transparent text-zinc-400 hover:text-white transition whitespace-nowrap"
    >
      <i class="fa-solid fa-cash-register mr-2"></i>Complete Payment
    </button>
  </div>

  <!-- ===== BOOKINGS TAB ===== -->
  <div id="tab-content-bookings" class="block">
    
    <!-- Loading State -->
    <div id="loadingState" class="text-center py-12">
      <div class="flex justify-center mb-4">
        <div class="animate-spin">
          <i class="fa-solid fa-spinner text-4xl text-yellow-500"></i>
        </div>
      </div>
      <p class="text-zinc-400">Loading dashboard...</p>
    </div>

    <!-- Error State -->
    <div id="errorState" class="hidden bg-red-900 text-red-100 p-4 rounded-lg mb-6 flex items-start gap-3">
      <i class="fa-solid fa-triangle-exclamation flex-shrink-0 mt-1"></i>
      <div id="errorMessage"></div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="hidden">
      
      <!-- Stats -->
      <div id="stats" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6 mb-10"></div>
      
      <!-- Search/Filter -->
      <div class="mb-6 flex flex-col sm:flex-row gap-3 sm:gap-4">
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Search by booking code, name, or email..."
          class="flex-1 bg-zinc-900 text-white px-4 py-2 sm:py-3 rounded-lg border border-zinc-700 focus:border-yellow-500 focus:outline-none transition text-sm sm:text-base"
        >
        <select 
          id="filterStatus" 
          class="bg-zinc-900 text-white px-4 py-2 sm:py-3 rounded-lg border border-zinc-700 focus:border-yellow-500 focus:outline-none transition text-sm sm:text-base"
        >
          <option value="">All Statuses</option>
          <option value="success">Paid</option>
          <option value="pending">Pending</option>
          <option value="completed">Completed</option>
        </select>
      </div>

      <!-- Bookings List -->
      <div id="bookings" class="grid gap-6"></div>
      
      <!-- Empty State -->
      <div id="emptyState" class="hidden text-center py-12 text-zinc-400">
        <i class="fa-solid fa-inbox text-5xl mb-4 opacity-50"></i>
        <p>No bookings found.</p>
      </div>

    </div>
  </div>

  <!-- ===== PAYMENTS TAB ===== -->
  <div id="tab-content-payments" class="hidden">
    <div class="max-w-4xl mx-auto">
      <div class="bg-zinc-900 rounded-2xl sm:rounded-3xl p-6 sm:p-8 shadow-2xl">
        <h2 class="text-2xl sm:text-3xl font-black text-yellow-500 mb-8 flex items-center gap-3">
          <i class="fa-solid fa-cash-register"></i>Complete Payment
        </h2>

        <!-- Payment Method Tabs -->
        <div class="flex gap-4 mb-8 border-b border-zinc-700 overflow-x-auto">
          <button 
            onclick="switchPaymentTab('transfer')"
            id="payment-tab-transfer"
            class="px-4 sm:px-6 py-3 font-bold border-b-4 border-green-500 text-green-500 transition whitespace-nowrap"
          >
            <i class="fa-solid fa-bank mr-2"></i>Bank Transfer
          </button>
          <button 
            onclick="switchPaymentTab('cash')"
            id="payment-tab-cash"
            class="px-4 sm:px-6 py-3 font-bold border-b-4 border-transparent text-zinc-400 hover:text-white transition whitespace-nowrap"
          >
            <i class="fa-solid fa-money-bill mr-2"></i>Cash Payment
          </button>
        </div>

        <!-- Bank Transfer Form -->
        <div id="payment-form-transfer" class="block space-y-6">
          <h3 class="text-xl font-bold text-white">Record Bank Transfer</h3>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-white mb-2">Booking Code</label>
              <input type="text" id="transfer-booking-code" placeholder="e.g., SBE-12345" 
                     class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-green-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-bold text-white mb-2">Amount (₦)</label>
              <input type="number" id="transfer-amount" placeholder="0" 
                     class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-green-500 focus:outline-none transition">
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-2">Bank Account Reference</label>
            <input type="text" id="transfer-reference" placeholder="e.g., ABJX-2024-001" 
                   class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-green-500 focus:outline-none transition">
          </div>

          <button onclick="recordBankTransfer()" 
                  class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">
            <i class="fa-solid fa-check mr-2"></i>Record Payment
          </button>
        </div>

        <!-- Cash Payment Form -->
        <div id="payment-form-cash" class="hidden space-y-6">
          <h3 class="text-xl font-bold text-white">Record Cash Payment</h3>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-white mb-2">Booking Code</label>
              <input type="text" id="cash-booking-code" placeholder="e.g., SBE-12345" 
                     class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-blue-500 focus:outline-none transition">
            </div>
            <div>
              <label class="block text-sm font-bold text-white mb-2">Amount Received (₦)</label>
              <input type="number" id="cash-amount" placeholder="0" 
                     class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-blue-500 focus:outline-none transition">
            </div>
          </div>

          <div>
            <label class="block text-sm font-bold text-white mb-2">Notes</label>
            <textarea id="cash-notes" placeholder="e.g., Received at salon..." rows="4"
                      class="w-full bg-zinc-800 text-white px-4 py-2 rounded-lg border border-zinc-700 focus:border-blue-500 focus:outline-none transition"></textarea>
          </div>

          <button onclick="recordCashPayment()" 
                  class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition">
            <i class="fa-solid fa-check mr-2"></i>Record Cash Payment
          </button>
        </div>

      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ============================
    // FIREBASE SETUP
    // ============================

    const firebaseConfig = {
      apiKey: import.meta.env.VITE_FIREBASE_API_KEY || "YOUR_API_KEY",
      authDomain: import.meta.env.VITE_FIREBASE_AUTH_DOMAIN || "your-project.firebaseapp.com",
      projectId: import.meta.env.VITE_FIREBASE_PROJECT_ID || "your-project-id",
      storageBucket: import.meta.env.VITE_FIREBASE_STORAGE_BUCKET || "your-bucket.appspot.com",
      messagingSenderId: import.meta.env.VITE_FIREBASE_MESSAGING_SENDER_ID || "your-sender-id",
      appId: import.meta.env.VITE_FIREBASE_APP_ID || "your-app-id"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Disable console in production
    if (import.meta.env.PROD) {
      console.log = () => {};
      console.error = () => {};
    }

    // ============================
    // AUTH CHECK
    // ============================

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Not authenticated, redirect to login
        window.location.href = 'login.html';
      } else {
        // Show admin email
        document.getElementById('adminEmailDisplay').textContent = user.email;
        // Load bookings
        loadBookings();
      }
    });

    // ============================
    // LOGOUT FUNCTION
    // ============================

    window.logoutAdmin = async function() {
      if (confirm('Are you sure you want to logout?')) {
        await signOut(auth);
        sessionStorage.removeItem('adminLoggedIn');
        sessionStorage.removeItem('adminEmail');
        window.location.href = 'login.html';
      }
    };

    // ============================
    // TAB SWITCHING
    // ============================

    window.switchTab = function(tab) {
      // Hide all tabs
      document.getElementById('tab-content-bookings').classList.add('hidden');
      document.getElementById('tab-content-payments').classList.add('hidden');

      // Remove active state from all tabs
      document.getElementById('tab-bookings').classList.remove('border-yellow-500', 'text-yellow-500');
      document.getElementById('tab-bookings').classList.add('border-transparent', 'text-zinc-400');
      document.getElementById('tab-payments').classList.remove('border-yellow-500', 'text-yellow-500');
      document.getElementById('tab-payments').classList.add('border-transparent', 'text-zinc-400');

      // Show selected tab
      if (tab === 'bookings') {
        document.getElementById('tab-content-bookings').classList.remove('hidden');
        document.getElementById('tab-bookings').classList.remove('border-transparent', 'text-zinc-400');
        document.getElementById('tab-bookings').classList.add('border-yellow-500', 'text-yellow-500');
      } else if (tab === 'payments') {
        document.getElementById('tab-content-payments').classList.remove('hidden');
        document.getElementById('tab-payments').classList.remove('border-transparent', 'text-zinc-400');
        document.getElementById('tab-payments').classList.add('border-yellow-500', 'text-yellow-500');
      }
    };

    window.switchPaymentTab = function(tab) {
      // Hide all forms
      document.getElementById('payment-form-transfer').classList.add('hidden');
      document.getElementById('payment-form-cash').classList.add('hidden');

      // Remove active state
      document.getElementById('payment-tab-transfer').classList.remove('border-green-500', 'text-green-500');
      document.getElementById('payment-tab-transfer').classList.add('border-transparent', 'text-zinc-400');
      document.getElementById('payment-tab-cash').classList.remove('border-blue-500', 'text-blue-500');
      document.getElementById('payment-tab-cash').classList.add('border-transparent', 'text-zinc-400');

      // Show selected form
      if (tab === 'transfer') {
        document.getElementById('payment-form-transfer').classList.remove('hidden');
        document.getElementById('payment-tab-transfer').classList.remove('border-transparent', 'text-zinc-400');
        document.getElementById('payment-tab-transfer').classList.add('border-green-500', 'text-green-500');
      } else if (tab === 'cash') {
        document.getElementById('payment-form-cash').classList.remove('hidden');
        document.getElementById('payment-tab-cash').classList.remove('border-transparent', 'text-zinc-400');
        document.getElementById('payment-tab-cash').classList.add('border-blue-500', 'text-blue-500');
      }
    };

    // ============================
    // LOAD BOOKINGS FROM FIREBASE
    // ============================

    async function loadBookings() {
      try {
        const querySnapshot = await getDocs(collection(db, "bookings"));
        const bookings = [];
        
        querySnapshot.forEach((doc) => {
          bookings.push({
            id: doc.id,
            ...doc.data()
          });
        });

        displayBookings(bookings);
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('mainContent').classList.remove('hidden');
      } catch (error) {
        console.error("Error loading bookings:", error);
        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('errorState').classList.remove('hidden');
        document.getElementById('errorMessage').innerHTML = `<strong>Error:</strong> Failed to load bookings. ${error.message}`;
      }
    }

    // ============================
    // DISPLAY BOOKINGS
    // ============================

    function displayBookings(bookings) {
      const bookingsContainer = document.getElementById('bookings');
      const emptyState = document.getElementById('emptyState');

      if (bookings.length === 0) {
        bookingsContainer.innerHTML = '';
        emptyState.classList.remove('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      
      bookingsContainer.innerHTML = bookings.map(booking => `
        <div class="bg-zinc-900 rounded-2xl p-4 sm:p-6 border border-zinc-800 hover:border-yellow-500 transition">
          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
            <div>
              <h3 class="text-lg sm:text-xl font-black text-yellow-500">${booking.bookingCode || 'N/A'}</h3>
              <p class="text-zinc-400 text-sm">${booking.name || 'N/A'}</p>
            </div>
            <div class="text-right">
              <p class="text-xs sm:text-sm text-zinc-400">Status</p>
              <span class="inline-block px-3 py-1 rounded-full text-xs sm:text-sm font-bold 
                ${booking.paymentStatus === 'success' ? 'bg-green-900 text-green-200' : 'bg-yellow-900 text-yellow-200'}">
                ${booking.paymentStatus === 'success' ? '✓ Paid' : '⏳ Pending'}
              </span>
            </div>
          </div>

          <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 text-xs sm:text-sm mb-4">
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Service</p>
              <p class="font-bold text-yellow-500">${(booking.service || 'N/A').split(' - ')[0]}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Date</p>
              <p class="font-bold">${booking.date || 'N/A'}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Time</p>
              <p class="font-bold">${booking.time || 'N/A'}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Deposit</p>
              <p class="font-bold text-green-400">${booking.depositPaid || '₦0'}</p>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 sm:gap-4 text-xs sm:text-sm mb-4">
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Phone</p>
              <p class="font-bold">${booking.phone || 'N/A'}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Email</p>
              <p class="font-bold truncate">${booking.email || 'N/A'}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Location</p>
              <p class="font-bold">${booking.location || 'N/A'}</p>
            </div>
            <div class="bg-zinc-800 rounded-lg p-3">
              <p class="text-zinc-400">Full Price</p>
              <p class="font-bold text-orange-400">${booking.fullPrice || '₦0'}</p>
            </div>
          </div>

          <div class="text-xs text-zinc-500">
            Booked: ${new Date(booking.createdAt).toLocaleDateString()}
          </div>
        </div>
      `).join('');
    }

    // ============================
    // PAYMENT RECORDING
    // ============================

    window.recordBankTransfer = async function() {
      const bookingCode = document.getElementById('transfer-booking-code').value.trim();
      const amount = document.getElementById('transfer-amount').value;
      const reference = document.getElementById('transfer-reference').value.trim();

      if (!bookingCode || !amount || !reference) {
        alert('Please fill all fields');
        return;
      }

      try {
        await updateDoc(doc(db, "bookings", bookingCode), {
          paymentStatus: 'completed',
          remainingBalance: '₦0',
          bankTransferReference: reference,
          bankTransferAmount: amount,
          bankTransferDate: new Date().toISOString()
        });

        alert('✅ Bank transfer recorded successfully!');
        document.getElementById('transfer-booking-code').value = '';
        document.getElementById('transfer-amount').value = '';
        document.getElementById('transfer-reference').value = '';
        loadBookings();
      } catch (error) {
        alert('❌ Error recording payment: ' + error.message);
      }
    };

    window.recordCashPayment = async function() {
      const bookingCode = document.getElementById('cash-booking-code').value.trim();
      const amount = document.getElementById('cash-amount').value;
      const notes = document.getElementById('cash-notes').value.trim();

      if (!bookingCode || !amount) {
        alert('Please fill required fields');
        return;
      }

      try {
        await updateDoc(doc(db, "bookings", bookingCode), {
          paymentStatus: 'completed',
          remainingBalance: '₦0',
          cashPaymentAmount: amount,
          cashPaymentNotes: notes,
          cashPaymentDate: new Date().toISOString()
        });

        alert('✅ Cash payment recorded successfully!');
        document.getElementById('cash-booking-code').value = '';
        document.getElementById('cash-amount').value = '';
        document.getElementById('cash-notes').value = '';
        loadBookings();
      } catch (error) {
        alert('❌ Error recording payment: ' + error.message);
      }
    };
  </script>

</body>
</html>
